name: Fmatrac Daily Export
on:
  schedule:
    - cron: '0 3 * * *' # Minden reggel 5:00-kor (Budapest, nyári idő)
  workflow_dispatch: # Így kézzel is elindíthatod bármikor tesztelni

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Playwright és függőségek telepítése
        run: |
          pip install playwright openpyxl
          playwright install chromium
          
      - name: Az fmatrac script futtatása
        env:
          # Ezeket a GitHub Settings -> Secrets menüben kell megadnod
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python fmatrac.py
