name: Fmatrac Daily Export
on:
  schedule:
    - cron: '5 0 * * *' # Minden nap éjfél után 5 perccel (UTC)
  workflow_dispatch: 

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Playwright és függőségek telepítése
        run: |
          pip install playwright openpyxl
          playwright install --with-deps chromium # Hozzáadtam a --with-deps-et a stabilitásért
          
      - name: Az fmatrac script futtatása
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python fmatrac.py
